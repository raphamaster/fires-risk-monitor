<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#102A4C"/>
    </linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#2BB67C"/>
    </linearGradient>
    <radialGradient id="hot1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A3C" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FF8C42" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB74A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFB74A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#FF8C42" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF5A3C"/>
      <stop offset="1" stop-color="#FFB74A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grade sutil -->
  <g stroke="#FFFFFF" stroke-opacity="0.03">
    <path d="M0 105H1200 M0 210H1200 M0 315H1200 M0 420H1200 M0 525H1200"/>
    <path d="M150 0V630 M300 0V630 M450 0V630 M600 0V630 M750 0V630 M900 0V630 M1050 0V630"/>
  </g>

  <rect x="0" y="0" width="1200" height="6" fill="url(#mintline)"/>

  <!-- ===== MAPA DE CALOR (lado direito) ===== -->
  <g transform="translate(700,90)">
