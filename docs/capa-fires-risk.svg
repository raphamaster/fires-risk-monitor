  <!-- badges -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15">
    <rect x="80" y="532" width="104" height="32" rx="16" fill="#16304F" stroke="#3DDC97" stroke-opacity="0.5"/>
    <text x="132" y="553" fill="#BFD4E6" text-anchor="middle">Power BI</text>
    <rect x="196" y="532" width="92" height="32" rx="16" fill="#16304F" stroke="#3DDC97" stroke-opacity="0.5"/>
    <text x="242" y="553" fill="#BFD4E6" text-anchor="middle">Python</text>
    <rect x="300" y="532" width="110" height="32" rx="16" fill="#16304F" stroke="#3DDC97" stroke-opacity="0.5"/>
    <text x="355" y="553" fill="#BFD4E6" text-anchor="middle">MongoDB</text>
    <rect x="422" y="532" width="92" height="32" rx="16" fill="#16304F" stroke="#3DDC97" stroke-opacity="0.5"/>
    <text x="468" y="553" fill="#BFD4E6" text-anchor="middle">Docker</text>
