      <circle cx="150" cy="140" r="6"/>
      <circle cx="172" cy="125" r="4"/>
      <circle cx="135" cy="162" r="4.5"/>
      <circle cx="300" cy="250" r="5.5"/>
      <circle cx="282" cy="268" r="4"/>
    </g>
    <g fill="#FFB74A">
      <circle cx="110" cy="320" r="4.5"/>
      <circle cx="330" cy="105" r="4"/>
      <circle cx="230" cy="360" r="4"/>
      <circle cx="315" cy="230" r="3.5"/>
    </g>
    <g fill="#3DDC97" fill-opacity="0.65">
