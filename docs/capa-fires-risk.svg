    <rect x="0" y="0" width="430" height="430" rx="14" fill="#16304F" stroke="#22456E" stroke-width="1.5"/>
    <!-- linhas de coordenadas -->
    <g stroke="#22456E" stroke-width="1" stroke-dasharray="4 6">
      <line x1="0" y1="108" x2="430" y2="108"/>
      <line x1="0" y1="215" x2="430" y2="215"/>
      <line x1="0" y1="322" x2="430" y2="322"/>
      <line x1="108" y1="0" x2="108" y2="430"/>
      <line x1="215" y1="0" x2="215" y2="430"/>
      <line x1="322" y1="0" x2="322" y2="430"/>
    </g>

    <!-- hotspots (focos) -->
    <circle cx="150" cy="140" r="85" fill="url(#hot1)"/>
    <circle cx="300" cy="250" r="65" fill="url(#hot1)"/>
    <circle cx="110" cy="320" r="55" fill="url(#hot2)"/>
    <circle cx="330" cy="105" r="45" fill="url(#hot2)"/>
    <circle cx="230" cy="360" r="40" fill="url(#hot2)"/>

    <!-- pontos de foco -->
