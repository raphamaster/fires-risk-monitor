    <g transform="translate(20,386)" font-family="Helvetica, Arial, sans-serif" font-size="12">
      <rect x="0" y="0" width="190" height="28" rx="14" fill="#0B1F3A" fill-opacity="0.75"/>
      <circle cx="20" cy="14" r="5" fill="#3DDC97"/>
      <text x="32" y="18" fill="#BFD4E6">baixo</text>
      <circle cx="84" cy="14" r="5" fill="#FFB74A"/>
      <text x="96" y="18" fill="#BFD4E6">m&#233;dio</text>
      <circle cx="150" cy="14" r="5" fill="#FF5A3C"/>
      <text x="162" y="18" fill="#BFD4E6">alto</text>
    </g>
