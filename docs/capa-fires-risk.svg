      <circle cx="380" cy="330" r="3"/>
      <circle cx="70" cy="230" r="3"/>
      <circle cx="250" cy="60" r="3"/>
      <circle cx="380" cy="180" r="3"/>
      <circle cx="180" cy="270" r="3"/>
    </g>

    <!-- anel de varredura no maior foco -->
    <circle cx="150" cy="140" r="20" fill="none" stroke="#FF5A3C" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="150" cy="140" r="34" fill="none" stroke="#FF5A3C" stroke-opacity="0.25" stroke-width="2"/>

