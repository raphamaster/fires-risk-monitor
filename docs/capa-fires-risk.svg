  <text x="180" y="116" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#FF8C42" text-anchor="middle">MONITORAMENTO</text>

  <!-- chama ao lado do título -->
  <g transform="translate(84,160) scale(1.05)">
    <path d="M22 0 C28 14 40 18 40 34 C40 48 31 56 21 56 C11 56 2 48 2 34 C2 26 6 22 9 16 C10 24 14 27 16 27 C14 18 17 8 22 0 Z" fill="url(#flame)"/>
    <path d="M21 30 C25 37 29 39 29 46 C29 52 25 56 21 56 C17 56 13 52 13 46 C13 40 18 37 21 30 Z" fill="#FFE2B8"/>
  </g>

  <text x="148" y="205" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="70" fill="#FFFFFF">Fires Risk</text>
  <text x="80" y="266" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#BFD4E6">INPE + Open-Meteo&#160;&#8594;&#160;MongoDB&#160;&#8594;&#160;Parquet&#160;&#8594;&#160;Power BI</text>

  <!-- cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(80,320)">
      <rect width="256" height="74" rx="10" fill="#16304F" stroke="#FF8C42" stroke-opacity="0.45"/>
      <text x="16" y="28" font-size="14" fill="#8FA8BF">Focos de queimadas</text>
      <text x="16" y="56" font-size="19" font-weight="bold" fill="#FFFFFF">S&#233;rie temporal &#8226; MM 7d</text>
    </g>
    <g transform="translate(352,320)">
      <rect width="256" height="74" rx="10" fill="#16304F" stroke="#FF8C42" stroke-opacity="0.45"/>
      <text x="16" y="28" font-size="14" fill="#8FA8BF">Risco clim&#225;tico</text>
      <text x="16" y="56" font-size="19" font-weight="bold" fill="#FFFFFF">Temperatura &#215; Vento</text>
    </g>
    <g transform="translate(80,408)">
      <rect width="256" height="74" rx="10" fill="#16304F" stroke="#FF8C42" stroke-opacity="0.45"/>
      <text x="16" y="28" font-size="14" fill="#8FA8BF">Geoespacial</text>
      <text x="16" y="56" font-size="19" font-weight="bold" fill="#FFFFFF">Heatmap &#8226; Risk Band</text>
    </g>
    <g transform="translate(352,408)">
